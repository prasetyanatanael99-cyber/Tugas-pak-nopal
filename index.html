<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio</title>
    <Style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: Arial, sans-serif;
color: #333;
font-family: Arial, Helvetica, sans-serif;
background-color: bisque;
}

nav {
display: flex;
justify-content: space-between;
background-color: #005A9C;
color: aliceblue;
align-items: center;
font-family: Verdana, Geneva, Tahoma, sans-serif;
padding: 10px;
}

ul {
display: flex;
list-style: none;
gap: 20px;
text-align: center;
flex-direction: row;
}


nav ul li a {
color: aliceblue;
text-decoration: none;
}

.logo {
font-size: 20px;
font-weight: bold;
color: #005A9C;
text-decoration: none;
}

.menu a {
margin-left: 25px;
text-decoration: none;
color: #333;
font-size: 14px;
}

.hero {
display: flex;
align-items: center;
justify-content: space-between;
padding: 60px 10%;
}

.teks-kiri {
max-width: 500px;
}

.sapaan {
color: #1F06AC;
font-weight: bold;
margin-bottom: 5px;
}

h1 {
font-size: 40px;
color: #111;
margin-bottom: 5px;
}

.subjudul {
color: #666;
font-size: 18px;
margin-bottom: 20px;
}

.deskripsi {
color: #777;
line-height: 1.6;
margin-bottom: 30px;
}

.tombol {
background-color: #930031;
color: white;
padding: 12px 28px;
border-radius: 25px;
text-decoration: none;
font-weight: bold;
font-size: 14px;
}

.foto-kanan {
position: relative;
width: 350px;
height: 500px;
display: flex;
justify-content: center;
align-items: flex-end;
}

.foto-kanan img {
width: 320px;
height: auto;
}

    </Style>
</head>
<body>
    <nav>
        <h1>Natanael</h1>
        <ul>
            <li>Tentang saya</li>
            <li>Portofolio</li>
            <li>Kontak</li>
        </ul>
        
    </nav>
    <section class="hero">
    <div class="teks-kiri">
    <p class="sapaan">Hai Saya Anak X PPLG 2</p>
    <h1>Natanael Eka prasetya</h1>
    <p class="subjudul">Aku Dari SMK Letris 2 Pamulang</p>
    <p class="deskripsi">Saya Bikin ini Tugas dari Pak Naufal</p>
    <a href="https://animeinweb.com/anime/6187" class="tombol">Mantap Bgt</a>
    </div>

    
    <div class="foto-kanan">
    <img src="Hunt Frieren .jpeg" alt="Foto Profil">
    </div>

</section>

</body>
</html>
